name: Android APK

on:
  push:
    branches:
      - feature/android-lan-coop
    paths:
      - "android/**"
      - "src/**"
      - "Externals/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openxray-android-lan-coop-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  transport-smoke-test:
    name: Test Android LAN TCP transport
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile TCP transport test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread \
            src/xrNetServer/android/AndroidLanSocket.cpp \
            src/xrNetServer/android/tests/AndroidLanSocketTest.cpp \
            -o android-lan-socket-test

      - name: Run TCP frame round-trip test
        run: ./android-lan-socket-test
